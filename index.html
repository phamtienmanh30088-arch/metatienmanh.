<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiến Mạnh Metai - Sang Trọng & Đẳng Cấp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #05060a; color: #f1f5f9; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        .app-container { width: 100%; max-width: 750px; background: #0e111a; border: 2px solid #00f0ff; border-radius: 16px; box-shadow: 0 0 25px rgba(0, 240, 255, 0.3); padding: 15px; }
        
        /* Welcome Screen */
        #welcome-screen { text-align: center; padding: 40px 20px; }
        .wel-title { color: #00f0ff; font-size: 24px; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; }
        .wel-sub { color: #ffcc00; font-size: 13px; font-weight: bold; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 1px; }

        /* Main App UI */
        .app-title { text-align: center; color: #00f0ff; font-size: 22px; font-weight: bold; text-transform: uppercase; margin: 0; }
        .music-bar { background: #151928; border: 1px solid #7000ff; border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; margin: 12px 0; }
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
        .nav-btn { flex: 1; min-width: 80px; padding: 8px; background: #151928; border: 1px solid #333; border-radius: 8px; color: #aaa; font-weight: bold; font-size: 11px; cursor: pointer; text-align: center; white-space: nowrap; }
        .nav-btn.active { background: #7000ff; color: #fff; border-color: #00f0ff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .input-box { width: 100%; padding: 10px; background: #000; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 12px; margin-bottom: 8px; }
        .btn-main { width: 100%; padding: 10px; background: linear-gradient(135deg, #00f0ff, #7000ff); border: none; border-radius: 8px; color: #fff; font-weight: bold; font-size: 12px; cursor: pointer; text-transform: uppercase; }
        .btn-sec { background: #333; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #ff4757; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .card { background: #151928; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .badge-admin { background: linear-gradient(135deg, #ff0055, #ffcc00); color: #000; font-size: 9px; font-weight: bold; padding: 2px 6px; border-radius: 6px; }
        
        /* Chat Layout */
        .chat-layout { display: flex; height: 350px; background: #151928; border-radius: 10px; border: 1px solid #333; overflow: hidden; }
        .chat-list { width: 35%; border-right: 1px solid #333; overflow-y: auto; }
        .chat-user-item { padding: 10px; font-size: 11px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #222; }
        .chat-user-item.active { background: rgba(0, 240, 255, 0.2); color: #00f0ff; }
        .chat-main { width: 65%; display: flex; flex-direction: column; }
        .chat-msgs { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .msg { max-width: 80%; padding: 6px 10px; border-radius: 8px; font-size: 11px; }
        .msg-me { align-self: flex-end; background: #7000ff; color: #fff; }
        .msg-them { align-self: flex-start; background: #222; color: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #222; }
        th { color: #00f0ff; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 1. MÀN HÌNH CHÀO MỪNG -->
        <div id="welcome-screen">
            <div class="wel-title">chào mừng bạn đến với Tiến Mạnh Metai</div>
            <div class="wel-sub">sự sang trọng của b sẽ làm nổi bật</div>
            <button class="btn-main" onclick="goToAuth()" style="max-width: 220px; margin: 0 auto;">Vào Hệ Thống</button>
        </div>

        <!-- 2. HỆ THỐNG CHÍNH (Ẩn khi ở Welcome) -->
        <div id="main-app" style="display: none;">
            <h1 class="app-title">Tiến Mạnh Metai</h1>

            <!-- Music Controller & MP3 Uploader -->
            <div class="music-bar">
                <div>
                    <div style="font-size: 11px; font-weight: bold;" id="track-name">🎵 Nhạc Nền Mặc Định</div>
                    <input type="file" id="mp3-file-input" accept="audio/mp3" style="font-size: 10px; margin-top: 4px;" onchange="loadCustomMusic(event)">
                </div>
                <button class="btn-sec" id="music-btn" onclick="toggleMusic()">Bật / Tắt</button>
            </div>

            <!-- Navigation Tabs -->
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="switchTab('tab-feed')">🌐 Bảng Tin</button>
                <button class="nav-btn" onclick="switchTab('tab-friends')">🔍 Tìm Bạn</button>
                <button class="nav-btn" onclick="switchTab('tab-chat')">💬 Nhắn Tin</button>
                <button class="nav-btn" onclick="switchTab('tab-profile')">👤 Cá Nhân</button>
                <button class="nav-btn" id="nav-admin" style="display:none;" onclick="switchTab('tab-admin')">👑 Admin</button>
                <button class="btn-sec" onclick="logout()" style="background:#ff4757; font-size:10px;">Thoát</button>
            </div>

            <!-- TAB 1: BẢNG TIN -->
            <div id="tab-feed" class="tab-content active">
                <div class="card">
                    <textarea id="post-text" class="input-box" placeholder="Bạn đang nghĩ gì?"></textarea>
                    <input type="text" id="post-img" class="input-box" placeholder="Link ảnh (nếu có)...">
                    <button class="btn-main" onclick="createPost()">Đăng Bài</button>
                </div>
                <div id="feed-container"></div>
            </div>

            <!-- TAB 2: TÌM BẠN BÈ -->
            <div id="tab-friends" class="tab-content">
                <input type="text" id="search-input" class="input-box" placeholder="🔎 Tìm kiếm tên tài khoản..." oninput="renderFriends()">
                <div id="friends-container"></div>
            </div>

            <!-- TAB 3: NHẮN TIN -->
            <div id="tab-chat" class="tab-content">
                <div class="chat-layout">
                    <div class="chat-list" id="chat-user-list"></div>
                    <div class="chat-main">
                        <div class="chat-msgs" id="chat-msg-area"></div>
                        <div style="padding: 6px; display: flex; gap: 5px; border-top: 1px solid #333;">
                            <input type="text" id="chat-input" class="input-box" placeholder="Nhập tin nhắn..." style="margin:0;" onkeypress="if(event.key==='Enter') sendChat()">
                            <button class="btn-main" style="width: 60px;" onclick="sendChat()">Gửi</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 4: CÁ NHÂN -->
            <div id="tab-profile" class="tab-content">
                <div class="card" style="text-align: center;">
                    <img id="prof-avt" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop" style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid #00f0ff; object-fit: cover; margin-bottom: 8px;">
                    <div style="font-size: 15px; font-weight: bold;" id="prof-name">Khách</div>
                    <div id="prof-badge"></div>
                    <div style="font-size: 11px; color: #aaa; margin: 6px 0;" id="prof-bio">"Chưa có tiểu sử"</div>
                    <div style="font-size: 10px; color: #666; margin-bottom: 10px;" id="prof-date">Ngày tham gia: --/--/----</div>

                    <div style="text-align: left; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
                        <label style="font-size:10px; color:#aaa;">Tên hiển thị:</label>
                        <input type="text" id="edit-name" class="input-box" placeholder="Tên mới...">
                        <label style="font-size:10px; color:#aaa;">Link Avatar:</label>
                        <input type="text" id="edit-avt" class="input-box" placeholder="Link ảnh avatar...">
                        <label style="font-size:10px; color:#aaa;">Link Bio:</label>
                        <input type="text" id="edit-bio" class="input-box" placeholder="Link tiểu sử / bio...">
                        <button class="btn-main" onclick="saveProfile()">Lưu Thay Đổi</button>
                    </div>
                </div>
            </div>

            <!-- TAB 5: ADMIN -->
            <div id="tab-admin" class="tab-content">
                <h3 style="color: #00f0ff; font-size: 13px; margin-bottom: 10px;">👑 Quản Trị Hệ Thống Admin</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>TK</th>
                                <th>MK</th>
                                <th>Trạng Thái Acc</th>
                                <th>Trạng Thái Chat</th>
                                <th>Hành Động</th>
                            </tr>
                        </thead>
                        <tbody id="admin-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 3. TRANG ĐĂNG NHẬP / ĐĂNG KÝ (Hiển thị ngay sau Welcome) -->
        <div id="auth-screen" style="display: none;">
            <div class="card" style="max-width: 320px; margin: 0 auto;">
                <div style="display: flex; gap: 5px; margin-bottom: 12px;">
                    <button class="nav-btn active" id="mode-l" onclick="setAuthMode('login')">Đăng Nhập</button>
                    <button class="nav-btn" id="mode-r" onclick="setAuthMode('register')">Đăng Ký</button>
                </div>
                <input type="text" id="auth-u" class="input-box" placeholder="Tên đăng nhập...">
                <input type="password" id="auth-p" class="input-box" placeholder="Mật khẩu...">
                <input type="password" id="auth-p2" class="input-box" placeholder="Nhập lại mật khẩu..." style="display:none;">
                <button class="btn-main" id="auth-sub" onclick="submitAuth()">Đăng Nhập Ngay</button>
            </div>
        </div>
    </div>

    <!-- Audio Player -->
    <audio id="audio-player" loop preload="auto">
        <source src="https://files.catbox.moe/u8o0q2.mp3" type="audio/mpeg">
    </audio>

    <script>
        const DEFAULT_AVT = "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop";

        let users = JSON.parse(localStorage.getItem('tm_users')) || [
            { username: "admin", password: "admin123", name: "Admin", avatar: DEFAULT_AVT, bio: "Quản trị viên", createdAt: "2026-01-01", isAdmin: true, isBanned: false, isMuted: false, friends: [] }
        ];
        let posts = JSON.parse(localStorage.getItem('tm_posts')) || [];
        let chats = JSON.parse(localStorage.getItem('tm_chats')) || [];
        let currentUser = JSON.parse(localStorage.getItem('tm_curr')) || null;
        let authMode = 'login';
        let activeChat = null;
        let isPlaying = false;

        const audio = document.getElementById('audio-player');

        window.onload = function() {
            saveData();
            if (currentUser) {
                showMainApp();
            } else {
                document.getElementById('welcome-screen').style.display = 'block';
            }
        };

        function saveData() {
            localStorage.setItem('tm_users', JSON.stringify(users));
            localStorage.setItem('tm_posts', JSON.stringify(posts));
            localStorage.setItem('tm_chats', JSON.stringify(chats));
            localStorage.setItem('tm_curr', JSON.stringify(currentUser));
        }

        function goToAuth() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
        }

        function showMainApp() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            updateUI();
            renderFeed();
            renderFriends();
        }

        /* MUSIC */
        function toggleMusic() {
            if (isPlaying) {
                audio.pause(); isPlaying = false;
                document.getElementById('music-btn').innerText = "Bật / Tắt";
            } else {
                audio.play().then(() => { isPlaying = true; document.getElementById('music-btn').innerText = "Đang Phát"; }).catch(e => {});
            }
        }

        function loadCustomMusic(event) {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                audio.src = fileURL;
                audio.play();
                isPlaying = true;
                document.getElementById('track-name').innerText = "🎵 " + file.name;
                document.getElementById('music-btn').innerText = "Đang Phát";
            }
        }

        /* TABS */
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'tab-friends') renderFriends();
            if (id === 'tab-chat') renderChatList();
            if (id === 'tab-profile') renderProfile();
            if (id === 'tab-admin') renderAdmin();
        }

        function updateUI() {
            document.getElementById('nav-admin').style.display = currentUser && currentUser.isAdmin ? "block" : "none";
        }

        /* AUTH */
        function setAuthMode(m) {
            authMode = m;
            document.getElementById('mode-l').classList.toggle('active', m==='login');
            document.getElementById('mode-r').classList.toggle('active', m==='register');
            document.getElementById('auth-p2').style.display = m==='register' ? 'block' : 'none';
            document.getElementById('auth-sub').innerText = m==='login' ? 'Đăng Nhập Ngay' : 'Đăng Ký Tài Khoản';
        }

        function submitAuth() {
            const u = document.getElementById('auth-u').value.trim();
            const p = document.getElementById('auth-p').value.trim();
            if (!u || !p) return alert("Vui lòng điền đầy đủ thông tin!");

            if (authMode === 'login') {
                const f = users.find(x => x.username === u && x.password === p);
                if (!f) return alert("Sai tài khoản hoặc mật khẩu!");
                if (f.isBanned) return alert("Tài khoản của bạn đã bị khóa bởi Admin!");
                currentUser = f;
                saveData();
                showMainApp();
            } else {
                const p2 = document.getElementById('auth-p2').value.trim();
                if (p !== p2) return alert("Mật khẩu nhập lại không khớp!");
                if (users.some(x => x.username === u)) return alert("Tên đăng nhập đã tồn tại!");
                
                users.push({ 
                    username: u, password: p, name: u, avatar: DEFAULT_AVT, 
                    bio: "Chưa có tiểu sử", createdAt: new Date().toLocaleDateString(), 
                    isAdmin: false, isBanned: false, isMuted: false, friends: [] 
                });
                saveData();
                alert("Đăng ký thành công! Vui lòng đăng nhập.");
                setAuthMode('login');
                document.getElementById('auth-u').value = u;
                document.getElementById('auth-p').value = '';
            }
        }

        function logout() {
            currentUser = null;
            saveData();
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'block';
        }

        /* FEED */
        function createPost() {
            if (currentUser.isMuted) return alert("Bạn đã bị Admin cấm chat/đăng bài!");
            const txt = document.getElementById('post-text').value.trim();
            const img = document.getElementById('post-img').value.trim();
            if (!txt) return alert("Nhập nội dung bài viết!");

            posts.unshift({ id: Date.now(), author: currentUser.username, content: txt, image: img, time: new Date().toLocaleDateString(), likes: [], comments: [] });
            saveData(); renderFeed();
            document.getElementById('post-text').value = '';
            document.getElementById('post-img').value = '';
        }

        function renderFeed() {
            const c = document.getElementById('feed-container');
            c.innerHTML = '';
            posts.forEach(p => {
                const u = users.find(x => x.username === p.author) || { avatar: DEFAULT_AVT, name: p.author };
                const canDel = currentUser && (currentUser.isAdmin || currentUser.username === p.author);
                let cmtHtml = p.comments.map(cm => `<div style="font-size:11px; margin-top:3px;"><b style="color:#00f0ff;">${cm.author}:</b> ${cm.text}</div>`).join('');

                c.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <img src="${u.avatar}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">
                                <div><b style="font-size:12px;">${u.name}</b> (${p.author}) ${p.author==='admin'?'<span class="badge-admin">ADMIN</span>':''}</div>
                            </div>
                            ${canDel ? `<button class="btn-danger" onclick="delPost(${p.id})">Xóa</button>` : ''}
                        </div>
                        <div style="font-size:12px; margin-bottom:8px; white-space:pre-line;">${p.content}</div>
                        ${p.image ? `<img src="${p.image}" style="width:100%; border-radius:8px; max-height:250px; object-fit:cover; margin-bottom:8px;">` : ''}
                        <button class="btn-sec" onclick="likePost(${p.id})">❤️ ${p.likes.length} Thích</button>
                        <div style="margin-top:8px; background:rgba(0,0,0,0.2); padding:6px; border-radius:6px;">
                            ${cmtHtml}
                            <div style="display:flex; gap:5px; margin-top:5px;">
                                <input type="text" id="cmt-${p.id}" class="input-box" placeholder="Bình luận..." style="margin:0; padding:6px; font-size:11px;">
                                <button class="btn-sec" onclick="addCmt(${p.id})">Gửi</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function likePost(id) {
            const p = posts.find(x => x.id === id);
            const idx = p.likes.indexOf(currentUser.username);
            if (idx === -1) p.likes.push(currentUser.username); else p.likes.splice(idx, 1);
            saveData(); renderFeed();
        }

        function addCmt(id) {
            if (currentUser.isMuted) return alert("Bạn đang bị cấm chat!");
            const val = document.getElementById(`cmt-${id}`).value.trim();
            if (!val) return;
            posts.find(x => x.id === id).comments.push({ author: currentUser.username, text: val });
            saveData(); renderFeed();
        }

        function delPost(id) {
            posts = posts.filter(x => x.id !== id);
            saveData(); renderFeed();
        }

        /* FRIENDS */
        function renderFriends() {
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            const c = document.getElementById('friends-container');
            c.innerHTML = '';
            const list = users.filter(x => x.username.toLowerCase().includes(q) && x.username !== currentUser.username);

            list.forEach(u => {
                const isF = currentUser.friends && currentUser.friends.includes(u.username);
                let btn = `<button class="btn-sec" onclick="addF('${u.username}')">Kết Bạn</button>`;
                if (isF) btn = `<button class="btn-main" style="width:auto; padding:5px 10px; font-size:10px;" onclick="openChat('${u.username}')">Nhắn Tin</button>`;
                c.innerHTML += `
                    <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding:8px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <img src="${u.avatar}" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
                            <div><b style="font-size:12px;">${u.name}</b> <span style="font-size:10px; color:#aaa;">(@${u.username})</span></div>
                        </div>
                        ${btn}
                    </div>
                `;
            });
        }

        function addF(name) {
            if (!currentUser.friends) currentUser.friends = [];
            currentUser.friends.push(name);
            saveData(); renderFriends();
            alert("Đã kết bạn thành công!");
        }

        function openChat(name) {
            switchTab('tab-chat');
            selectChatUser(name);
        }

        /* CHAT */
        function renderChatList() {
            const list = document.getElementById('chat-user-list');
            list.innerHTML = '';
            users.forEach(u => {
                if (u.username === currentUser.username) return;
                list.innerHTML += `<div class="chat-user-item ${activeChat===u.username?'active':''}" onclick="selectChatUser('${u.username}')">${u.name}</div>`;
            });
        }

        function selectChatUser(name) {
            activeChat = name;
            renderChatList();
            renderMsgs();
        }

        function renderMsgs() {
            const area = document.getElementById('chat-msg-area');
            if (!activeChat) return;
            const conv = chats.filter(m => (m.from === currentUser.username && m.to === activeChat) || (m.from === activeChat && m.to === currentUser.username));
            area.innerHTML = conv.map(m => `<div class="msg ${m.from===currentUser.username?'msg-me':'msg-them'}">${m.text}</div>`).join('');
            area.scrollTop = area.scrollHeight;
        }

        function sendChat() {
            if (currentUser.isMuted) return alert("Bạn đã bị Admin cấm chat!");
            if (!activeChat) return alert("Chọn người để nhắn tin!");
            const txt = document.getElementById('chat-input').value.trim();
            if (!txt) return;
            chats.push({ from: currentUser.username, to: activeChat, text: txt });
            saveData(); renderMsgs();
            document.getElementById('chat-input').value = '';
        }

        /* PROFILE */
        function renderProfile() {
            document.getElementById('prof-avt').src = currentUser.avatar;
            document.getElementById('prof-name').innerText = currentUser.name;
            document.getElementById('prof-bio').innerText = currentUser.bio.startsWith('http') ? `Bio: ${currentUser.bio}` : `"${currentUser.bio}"`;
            document.getElementById('prof-date').innerText = "Ngày tham gia: " + (currentUser.createdAt || '01/01/2026');
            document.getElementById('prof-badge').innerHTML = currentUser.isAdmin ? '<span class="badge-admin">ADMIN</span>' : '';
            
            document.getElementById('edit-name').value = currentUser.name;
            document.getElementById('edit-avt').value = currentUser.avatar;
            document.getElementById('edit-bio').value = currentUser.bio;
        }

        function saveProfile() {
            currentUser.name = document.getElementById('edit-name').value.trim() || currentUser.username;
            currentUser.avatar = document.getElementById('edit-avt').value.trim() || DEFAULT_AVT;
            currentUser.bio = document.getElementById('edit-bio').value.trim() || "Chưa có tiểu sử";
            
            const idx = users.findIndex(x => x.username === currentUser.username);
            if (idx !== -1) users[idx] = currentUser;
            saveData(); renderProfile(); renderFeed();
            alert("Đã lưu thay đổi thông tin cá nhân!");
        }

        /* ADMIN */
        function renderAdmin() {
            const tb = document.getElementById('admin-tbody');
            tb.innerHTML = '';
            users.forEach(u => {
                if (u.isAdmin) return;
                tb.innerHTML += `
                    <tr>
                        <td><b>${u.username}</b></td>
                        <td style="color:#ff007f;">${u.password}</td>
                        <td>${u.isBanned ? 'Khóa' : 'Hoạt Động'}</td>
                        <td>${u.isMuted ? 'Cấm Chat' : 'Bình Thường'}</td>
                        <td>
                            <button class="btn-danger" onclick="toggleBan('${u.username}')">${u.isBanned?'Mở Acc':'Khóa Acc'}</button>
                            <button class="btn-sec" style="background:#eccc68; color:#000;" onclick="toggleMute('${u.username}')">${u.isMuted?'Mở Chat':'Cấm Chat'}</button>
                        </td>
                    </tr>
                `;
            });
        }

        function toggleBan(name) {
            const u = users.find(x => x.username === name);
            if(u) { u.isBanned = !u.isBanned; saveData(); renderAdmin(); }
        }

        function toggleMute(name) {
            const u = users.find(x => x.username === name);
            if(u) { u.isMuted = !u.isMuted; saveData(); renderAdmin(); }
        }
    </script>
</body>
</html>
