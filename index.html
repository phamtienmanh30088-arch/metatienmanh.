<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tmanh Meta - Đẳng Cấp Thể Hiện</title>
    <style>
        body {
            background-color: #08090d;
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #121522;
            border: 2px solid #00f0ff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }
        h1 {
            text-align: center;
            color: #00f0ff;
            text-transform: uppercase;
            font-size: 26px;
            margin-bottom: 5px;
        }
        p {
            text-align: center;
            color: #ff007f;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .box {
            background: #1a1d2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(135deg, #00f0ff, #7000ff);
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tmanh Meta</h1>
        <p>nơi thể hiện đẳng cấp của bạn</p>

        <div class="box">
            <h3 style="color: #00f0ff; margin-top: 0;">🎵 Trình Phát Nhạc 24/7</h3>
            <p style="color: #94a3b8; text-align: left; margin-bottom: 10px;">Bấm nút bên dưới để bật bài hát "Nơi Này Có Anh"</p>
            <button onclick="playMusic()">Bật / Dừng Nhạc</button>
        </div>

        <div class="box">
            <h3 style="color: #00f0ff; margin-top: 0;">🌐 Bảng Tin Chào Mừng</h3>
            <p style="color: #fff; text-align: left; font-weight: normal;">chào mừng bạn đến với chúng tôi - admin</p>
        </div>
    </div>

    <audio id="audio-player" loop>
        <source src="https://files.catbox.moe/u8o0q2.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('audio-player');
        let isPlaying = false;

        function playMusic() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    alert("Đang phát nhạc thành công!");
                }).catch(e => {
                    alert("Trình duyệt chặn, hãy chạm thêm lần nữa!");
                });
            } else {
                audio.pause();
                isPlaying = false;
                alert("Đã dừng nhạc!");
            }
        }
    </script>
</body>
</html>
