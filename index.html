<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tmanh Meta - Đẳng Cấp Thể Hiện</title>
    <style>
        :root {
            --bg-dark: #08090d;
            --card-bg: rgba(15, 17, 26, 0.85);
            --neon-blue: #00f0ff;
            --neon-purple: #7000ff;
            --neon-pink: #ff007f;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ff4757;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 10px;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(112, 0, 255, 0.06) 0%, transparent 40%);
        }

        .main-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.12);
            padding: 20px;
            z-index: 10;
        }

        /* Header */
        .header-brand {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-title {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 12px;
            color: var(--neon-blue);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 600;
        }

        /* Music Controller Bar */
        .music-bar {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(112, 0, 255, 0.25);
            border-radius: 12px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .music-icon {
            font-size: 18px;
            color: var(--neon-pink);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .music-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
        }

        .music-sub {
            font-size: 11px;
            color: var(--text-muted);
        }

        .btn-music {
            padding: 6px 14px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
            font-weight: 700;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .nav-btn {
            flex: 1;
            min-width: 95px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            color: #fff;
            border-color: rgba(0, 240, 255, 0.3);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2), rgba(112, 0, 255, 0.2));
            color: var(--neon-blue);
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Form Inputs & Buttons */
        .input-field {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        textarea.input-field {
            resize: vertical;
            min-height: 70px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        /* PROFILE SECTION - GỌN GÀNG VÀ HIỆN ĐẠI */
        .profile-wrapper {
            max-width: 500px;
            margin: 0 auto;
        }

        .profile-card-clean {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 240, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .avatar-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 12px;
        }

        .avatar-img-clean {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        .user-title {
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .badge-admin {
            background: linear-gradient(135deg, #ff0055, #ffcc00);
            color: #000;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 8px;
            text-transform: uppercase;
        }

        .user-bio-clean {
            font-size: 12px;
            color: var(--text-muted);
            margin: 8px 0 14px;
            font-style: italic;
            line-height: 1.4;
        }

        .user-joined {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 16px;
        }

        .profile-edit-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            text-align: left;
            display: none;
        }

        /* FRIENDS SECTION */
        .friend-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 10px;
        }

        .friend-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .friend-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--neon-blue);
        }

        /* PRIVATE CHAT SECTION */
        .chat-layout {
            display: flex;
            height: 420px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .chat-users-list {
            width: 35%;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            overflow-y: auto;
        }

        .chat-user-item {
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .chat-user-item:hover, .chat-user-item.active {
            background: rgba(0, 240, 255, 0.1);
        }

            width: 8px;
            height: 8px;
            background: var(--success);
            border
